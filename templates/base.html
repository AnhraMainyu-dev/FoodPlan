{% load static %}
<!DOCTYPE html>
<html lang="eng">
<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

                <a class="navbar-brand" href="#">

</html>
